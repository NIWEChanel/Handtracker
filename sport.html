<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SportBike — Hand Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier Prime',monospace}
::-webkit-scrollbar{display:none}

:root{
  --g:#00ff41;
  --g2:#00cc33;
  --g3:#39ff14;
  --dim:rgba(0,255,65,0.15);
  --dimb:rgba(0,255,65,0.2);
}

#app{position:relative;width:100vw;height:100vh;background:#000;overflow:hidden}

#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#canvas{position:absolute;inset:0;width:100%;height:100%}
#particleCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* SCANLINES */
#app::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,65,0.018) 2px,rgba(0,255,65,0.018) 4px);pointer-events:none;z-index:10}

/* CORNERS */
.corner{position:absolute;width:28px;height:28px;border-color:var(--g);border-style:solid;opacity:0.55;z-index:20}
.corner.tl{top:16px;left:16px;border-width:2px 0 0 2px}
.corner.tr{top:16px;right:16px;border-width:2px 2px 0 0}
.corner.bl{bottom:44px;left:16px;border-width:0 0 2px 2px}
.corner.br{bottom:44px;right:16px;border-width:0 2px 2px 0}

/* LOGO */
#logo{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-family:'Orbitron',monospace;font-size:20px;font-weight:900;letter-spacing:6px;color:var(--g);text-shadow:0 0 14px var(--g),0 0 30px rgba(0,255,65,0.3);z-index:20;white-space:nowrap}

/* HUD LEFT */
#hudLeft{position:absolute;top:16px;left:16px;z-index:20;display:none;padding-top:36px}
.hud-block{background:rgba(0,0,0,0.65);border:1px solid rgba(0,255,65,0.22);padding:7px 12px;margin-bottom:5px;min-width:150px}
.hud-label{font-size:8px;letter-spacing:2px;color:#1a4d1a;text-transform:uppercase;margin-bottom:2px;font-family:'Orbitron',monospace}
.hud-val{font-size:12px;color:var(--g);letter-spacing:1px;font-family:'Courier Prime',monospace}

/* HUD RIGHT */
#hudRight{position:absolute;top:16px;right:16px;z-index:20;display:none;padding-top:36px;text-align:right}
.hud-block-r{background:rgba(0,0,0,0.65);border:1px solid rgba(0,200,30,0.2);padding:7px 12px;margin-bottom:5px;min-width:150px}
.hud-label-r{font-size:8px;letter-spacing:2px;color:#1a4020;text-transform:uppercase;margin-bottom:2px;font-family:'Orbitron',monospace}
.hud-val-r{font-size:12px;color:var(--g2);letter-spacing:1px;font-family:'Courier Prime',monospace}

/* BOTTOM BAR */
#bottomBar{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);z-index:20;display:none;flex-wrap:wrap;justify-content:center;gap:6px}
.stat-pill{background:rgba(0,0,0,0.65);border:1px solid rgba(0,255,65,0.18);padding:5px 14px;font-size:9px;color:var(--g2);letter-spacing:2px;white-space:nowrap;font-family:'Orbitron',monospace}
.stat-pill span{color:#fff;margin-left:5px;font-family:'Courier Prime',monospace}

/* INTERACTION FLASH */
#interactionFlash{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;font-family:'Orbitron',monospace;font-size:clamp(28px,5vw,58px);font-weight:900;letter-spacing:6px;color:var(--g3);text-shadow:0 0 30px var(--g3);opacity:0;pointer-events:none;transition:opacity 0.15s;text-align:center}

/* GESTURE BADGE */
#gestureBadge{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);z-index:20;display:none;text-align:center}
.badge-gesture{font-family:'Orbitron',monospace;font-size:clamp(14px,2.5vw,22px);font-weight:700;letter-spacing:4px;color:var(--g);opacity:0.7}

/* FOOTER */
#footer{position:absolute;bottom:0;left:0;right:0;z-index:25;height:32px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.75);border-top:1px solid rgba(0,255,65,0.15)}
#footer span{font-family:'Courier Prime',monospace;font-size:10px;letter-spacing:2px;color:#1a5c1a}
#footer a{font-family:'Orbitron',monospace;font-size:10px;font-weight:700;letter-spacing:2px;color:var(--g);text-decoration:none;margin-left:5px;transition:text-shadow 0.2s}
#footer a:hover{text-shadow:0 0 12px var(--g)}

/* START OVERLAY */
#startOverlay{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(0,0,0,0.95)}
.ol-logo{font-family:'Orbitron',monospace;font-size:clamp(42px,9vw,88px);font-weight:900;letter-spacing:8px;color:var(--g);text-shadow:0 0 40px var(--g),0 0 80px rgba(0,255,65,0.25)}
.ol-sub{font-family:'Courier Prime',monospace;font-size:11px;letter-spacing:4px;color:#1a5c1a;text-transform:uppercase;margin-top:-10px}
#loadWrap{width:220px;height:1px;background:#0d1a0d;display:none;margin-top:6px}
#loadFill{height:100%;background:var(--g);box-shadow:0 0 8px var(--g);width:0%;transition:width 0.4s}
#loadTxt{font-family:'Orbitron',monospace;font-size:8px;letter-spacing:3px;color:var(--g2);opacity:0.6;display:none}
#startBtn{background:transparent;border:1px solid var(--g);color:var(--g);font-family:'Orbitron',monospace;font-size:11px;font-weight:700;letter-spacing:4px;padding:12px 38px;cursor:pointer;text-transform:uppercase;transition:all 0.2s;margin-top:6px}
#startBtn:hover{background:rgba(0,255,65,0.08);text-shadow:0 0 10px var(--g)}
#startBtn:disabled{opacity:0.3;cursor:default}
.ol-hint{font-family:'Courier Prime',monospace;font-size:10px;letter-spacing:2px;color:#1a4d1a;text-align:center;max-width:320px;line-height:2}

@media(max-width:480px){
  #hudLeft,#hudRight{display:none!important}
  #bottomBar{bottom:36px}
  .stat-pill{font-size:8px;padding:4px 9px}
}
</style>
</head>
<body>
<div id="app">
  <video id="vid" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <canvas id="particleCanvas"></canvas>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div id="logo">SPORTBIKE</div>

  <div id="hudLeft">
    <div class="hud-block" style="margin-top:34px">
      <div class="hud-label">Left Hand</div>
      <div class="hud-val" id="lgest">—</div>
    </div>
    <div class="hud-block">
      <div class="hud-label">Speed</div>
      <div class="hud-val" id="spd">0 km/h</div>
    </div>
    <div class="hud-block">
      <div class="hud-label">Particles</div>
      <div class="hud-val" id="pcnt">0</div>
    </div>
  </div>

  <div id="hudRight">
    <div class="hud-block-r" style="margin-top:34px">
      <div class="hud-label-r">Right Hand</div>
      <div class="hud-val-r" id="rgest">—</div>
    </div>
    <div class="hud-block-r">
      <div class="hud-label-r">Distance</div>
      <div class="hud-val-r" id="hdist">—</div>
    </div>
    <div class="hud-block-r">
      <div class="hud-label-r">Energy</div>
      <div class="hud-val-r" id="energy">—</div>
    </div>
  </div>

  <div id="interactionFlash"></div>

  <div id="gestureBadge">
    <div class="badge-gesture" id="badgeText">—</div>
  </div>

  <div id="bottomBar">
    <div class="stat-pill">HANDS <span id="hcount">0</span></div>
    <div class="stat-pill">INTERACTION <span id="interact">—</span></div>
    <div class="stat-pill">FPS <span id="fps">—</span></div>
  </div>

  <div id="footer">
    <span>DEVELOPED BY</span>
    <a href="https://www.instagram.com/1chanel___/" target="_blank" rel="noopener">CHANEL</a>
  </div>

  <div id="startOverlay">
    <div class="ol-logo">SPORTBIKE</div>
    <div class="ol-sub">// Hand Gesture Tracker</div>
    <button id="startBtn" onclick="init()">Enable Camera</button>
    <div id="loadWrap"><div id="loadFill"></div></div>
    <div id="loadTxt">LOADING AI MODEL</div>
    <div class="ol-hint">Use both hands · Move · Gesture · Interact<br>Runs entirely in your browser — nothing is recorded</div>
  </div>
</div>

<script>
const vid=document.getElementById('vid');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const pc=document.getElementById('particleCanvas');
const pctx=pc.getContext('2d');

let hue=120,frameCount=0,active=false;
let landmarks=[],handedness=[];
let prevLm=[null,null];
let particles=[];
let trails=[[],[]];
let lastFPS=60,lastTime=performance.now();
let flashTimeout=null;

function resize(){canvas.width=pc.width=window.innerWidth;canvas.height=pc.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);

const CONN=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];

function classify(lm){
  const tips=[8,12,16,20],pip=[6,10,14,18];let open=0;
  for(let i=0;i<4;i++) if(lm[tips[i]].y<lm[pip[i]].y) open++;
  if(open>=4) return 'OPEN HAND';
  if(open===0) return 'FIST';
  if(open===1&&lm[8].y<lm[6].y) return 'POINT';
  if(open===2&&lm[8].y<lm[6].y&&lm[12].y<lm[10].y) return 'PEACE';
  return 'PINCH';
}

function palm(lm){return{x:lm[9].x*canvas.width,y:lm[9].y*canvas.height};}
function dist(a,b){return Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2);}

function flash(text){
  const el=document.getElementById('interactionFlash');
  el.textContent=text;el.style.opacity='1';
  clearTimeout(flashTimeout);
  flashTimeout=setTimeout(()=>{el.style.opacity='0';},600);
}

function spawn(x,y,color,n=10){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=2+Math.random()*6;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color,size:2+Math.random()*3});
  }
}

function drawParticles(){
  pctx.clearRect(0,0,pc.width,pc.height);
  particles=particles.filter(p=>p.life>0.02);
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vx*=0.94;p.vy*=0.94;p.life-=0.022;
    pctx.globalAlpha=p.life;pctx.fillStyle=p.color;pctx.shadowColor=p.color;pctx.shadowBlur=10;
    pctx.beginPath();pctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);pctx.fill();
  });
  pctx.globalAlpha=1;
  document.getElementById('pcnt').textContent=particles.length;
}

function green(offset,l=65){
  // stays in green spectrum: 100–150
  const h=100+(offset%50);
  return `hsl(${h},100%,${l}%)`;
}

function drawHand(lm,idx){
  const W=canvas.width,H=canvas.height;
  const shift=idx===0?0:20;

  CONN.forEach(([a,b],i)=>{
    const c=green(i*2+shift);
    ctx.strokeStyle=c;ctx.shadowColor=c;ctx.shadowBlur=12;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(lm[a].x*W,lm[a].y*H);ctx.lineTo(lm[b].x*W,lm[b].y*H);ctx.stroke();
  });

  lm.forEach((p,i)=>{
    const c=green(i+shift);
    ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=14;
    ctx.beginPath();ctx.arc(p.x*W,p.y*H,i===0?7:3.5,0,Math.PI*2);ctx.fill();
  });

  [4,8,12,16,20].forEach((ti,i)=>{
    const c=`hsl(${110+i*6},100%,75%)`;
    ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=22;
    ctx.beginPath();ctx.arc(lm[ti].x*W,lm[ti].y*H,5.5,0,Math.PI*2);ctx.fill();
  });

  const p0=palm(lm);
  trails[idx].push({...p0});
  if(trails[idx].length>35) trails[idx].shift();
  for(let i=1;i<trails[idx].length;i++){
    const t=trails[idx][i],tp=trails[idx][i-1];
    ctx.strokeStyle=`hsla(120,100%,50%,${(i/trails[idx].length)*0.5})`;
    ctx.shadowBlur=5;ctx.lineWidth=(i/trails[idx].length)*5;
    ctx.beginPath();ctx.moveTo(tp.x,tp.y);ctx.lineTo(t.x,t.y);ctx.stroke();
  }

  const g=classify(lm);
  if(g==='OPEN HAND'&&frameCount%3===0) spawn(p0.x,p0.y,'#00ff41',4);
  if(g==='FIST'&&frameCount%6===0) spawn(p0.x,p0.y,'#39ff14',10);
  if(g==='POINT'){
    const tip=lm[8];
    ctx.strokeStyle='rgba(0,255,65,0.65)';ctx.shadowColor='#00ff41';ctx.shadowBlur=18;ctx.lineWidth=1.5;
    ctx.setLineDash([4,10]);
    ctx.beginPath();ctx.moveTo(tip.x*W,tip.y*H);
    const dx=tip.x-lm[9].x,dy=tip.y-lm[9].y,len=Math.sqrt(dx*dx+dy*dy)||1;
    ctx.lineTo(tip.x*W+(dx/len)*300,tip.y*H+(dy/len)*300);ctx.stroke();ctx.setLineDash([]);
  }
}

// finger tip indices: thumb=4, index=8, middle=12, ring=16, pinky=20
const FINGERTIPS=[4,8,12,16,20];
const TOUCH_THRESHOLD=0.045; // in normalised coords

function drawDualHand(){
  if(landmarks.length<2) return;
  const lm0=landmarks[0],lm1=landmarks[1];
  const W=canvas.width,H=canvas.height;

  let touchCount=0;
  let interactLabel='—';

  FINGERTIPS.forEach(ti=>{
    FINGERTIPS.forEach(tj=>{
      const ax=lm0[ti].x,ay=lm0[ti].y;
      const bx=lm1[tj].x,by=lm1[tj].y;
      const d=Math.sqrt((ax-bx)**2+(ay-by)**2);

      if(d<TOUCH_THRESHOLD){
        touchCount++;
        const px1=ax*W,py1=ay*H;
        const px2=bx*W,py2=by*H;
        const mx=(px1+px2)/2,my=(py1+py2)/2;

        // Glow line between the two touching fingertips
        const grad=ctx.createLinearGradient(px1,py1,px2,py2);
        grad.addColorStop(0,'rgba(57,255,20,0.9)');
        grad.addColorStop(0.5,'rgba(255,255,255,1)');
        grad.addColorStop(1,'rgba(0,255,65,0.9)');
        ctx.strokeStyle=grad;
        ctx.shadowColor='#39ff14';
        ctx.shadowBlur=25;
        ctx.lineWidth=3;
        ctx.beginPath();ctx.moveTo(px1,py1);ctx.lineTo(px2,py2);ctx.stroke();

        // Spark dot at contact midpoint
        ctx.fillStyle='#fff';
        ctx.shadowColor='#39ff14';
        ctx.shadowBlur=30;
        ctx.beginPath();ctx.arc(mx,my,4+Math.sin(frameCount*0.3)*2,0,Math.PI*2);ctx.fill();

        // Particle burst on touch
        if(frameCount%5===0) spawn(mx,my,'#39ff14',6);
        if(frameCount%10===0) spawn(mx,my,'#ffffff',3);

        interactLabel='TOUCH';
      } else if(d<TOUCH_THRESHOLD*3){
        // Near-touch: draw a dim dotted approach line
        const px1=ax*W,py1=ay*H;
        const px2=bx*W,py2=by*H;
        const alpha=(1-(d/(TOUCH_THRESHOLD*3)))*0.55;
        ctx.strokeStyle=`rgba(0,255,65,${alpha})`;
        ctx.shadowColor='#00ff41';
        ctx.shadowBlur=8;
        ctx.lineWidth=1;
        ctx.setLineDash([3,6]);
        ctx.beginPath();ctx.moveTo(px1,py1);ctx.lineTo(px2,py2);ctx.stroke();
        ctx.setLineDash([]);
        if(interactLabel==='—') interactLabel='NEAR';
      }
    });
  });

  if(touchCount>0&&frameCount%25===0) flash(touchCount>2?'MULTI TOUCH':'TOUCH');

  // HUD updates
  const p0=palm(lm0),p1=palm(lm1);
  const pd=dist(p0,p1);
  const e=Math.round((1-Math.min(pd/400,1))*100);
  document.getElementById('hdist').textContent=touchCount>0?touchCount+' finger(s)':'—';
  document.getElementById('energy').textContent=e+'%';
  document.getElementById('interact').textContent=interactLabel;
}

function getSpeed(lm,prev){
  if(!prev) return 0;
  const dx=lm[9].x-prev[9].x,dy=lm[9].y-prev[9].y;
  return Math.min(299,Math.round(Math.sqrt(dx*dx+dy*dy)*4000));
}

function renderLoop(){
  requestAnimationFrame(renderLoop);
  const now=performance.now();lastFPS=Math.round(1000/(now-lastTime));lastTime=now;
  if(!active) return;
  frameCount++;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  landmarks.forEach((lm,i)=>drawHand(lm,i));
  if(landmarks.length===2) drawDualHand();
  drawParticles();

  document.getElementById('hcount').textContent=landmarks.length;
  document.getElementById('fps').textContent=lastFPS;

  let lg='—',rg='—';
  handedness.forEach((h,i)=>{const g=classify(landmarks[i]);if(h==='Left')lg=g;else rg=g;});
  document.getElementById('lgest').textContent=lg;
  document.getElementById('rgest').textContent=rg;
  document.getElementById('badgeText').textContent=lg!=='—'?lg:rg!=='—'?rg:'—';

  let spd=0;
  landmarks.forEach((lm,i)=>{const s=getSpeed(lm,prevLm[i]);spd=Math.max(spd,s);prevLm[i]=lm;});
  document.getElementById('spd').textContent=spd+' km/h';
  if(landmarks.length===0){document.getElementById('interact').textContent='—';document.getElementById('hdist').textContent='—';document.getElementById('energy').textContent='—';}
}
renderLoop();

async function loadScript(src){
  return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});
}

async function init(){
  const btn=document.getElementById('startBtn');
  const lw=document.getElementById('loadWrap');
  const lf=document.getElementById('loadFill');
  const lt=document.getElementById('loadTxt');
  const ol=document.getElementById('startOverlay');
  const hint=ol.querySelector('.ol-hint');
  btn.disabled=true;btn.textContent='CONNECTING...';
  hint.textContent='Requesting camera permission...';

  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480}});}
  catch(e){hint.textContent='Camera denied. Allow access and refresh.';btn.disabled=false;btn.textContent='RETRY';return;}

  vid.srcObject=stream;
  hint.textContent='Downloading AI model — one moment...';
  lw.style.display='block';lt.style.display='block';lf.style.width='15%';

  try{
    await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js');lf.style.width='50%';
    await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js');lf.style.width='80%';
  }catch(e){hint.textContent='Failed to load AI model. Check connection.';btn.disabled=false;btn.textContent='RETRY';return;}

  const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`});
  hands.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:0.65,minTrackingConfidence:0.5});
  hands.onResults(r=>{landmarks=r.multiHandLandmarks||[];handedness=(r.multiHandedness||[]).map(h=>h.label);});

  await hands.initialize();lf.style.width='100%';
  new Camera(vid,{onFrame:async()=>{await hands.send({image:vid});},width:640,height:480}).start();
  active=true;

  document.getElementById('hudLeft').style.display='block';
  document.getElementById('hudRight').style.display='block';
  document.getElementById('bottomBar').style.display='flex';
  document.getElementById('gestureBadge').style.display='block';

  setTimeout(()=>{ol.style.transition='opacity 0.5s';ol.style.opacity='0';setTimeout(()=>ol.remove(),500);},300);
}
</script>
</body>
</html>
